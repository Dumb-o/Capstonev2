<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreeLedger — Find Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>

  <nav class="dash-nav">
    <div class="dash-nav-left">
      <a class="nav-logo" href="../freeledger/index.html">
        <div class="nav-logo-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        FreeLedger
      </a>
      <div class="portal-tag">FREELANCER PORTAL</div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="jobs.html">Find Jobs</a>
        <a href="contracts.html">My Contracts</a>
        <a href="profile.html">My Profile</a>
        <a href="messages.html">Messages</a>
      </div>
    </div>
    <div class="dash-nav-right">
      <button class="btn btn-outline btn-sm" onclick="AUTH.logout()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
      <div class="user-chip">
        <div class="user-info"><div class="uname" id="nav-uname">—</div><div class="urole" id="nav-urole">Freelancer</div></div>
        <div class="user-avatar" id="nav-avatar">?</div>
      </div>
    </div>
  </nav>

  <div class="page-body">
    <div class="page-header">
      <div>
        <h1 class="page-title">Find Jobs</h1>
        <p class="page-sub">Browse <span id="job-count">0</span> open projects — matched skills are highlighted</p>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-grid" onclick="setView('grid')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="btn-list" onclick="setView('list')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="search" placeholder="Search title, skill, keyword…" oninput="filterJobs()">
      </div>
      <select class="filter-select" id="f-cat" onchange="filterJobs()">
        <option value="">All Categories</option>
        <option>Development</option><option>Design</option><option>Marketing</option>
        <option>Writing</option><option>Smart Contracts</option><option>Data & Analytics</option>
      </select>
      <select class="filter-select" id="f-budget" onchange="filterJobs()">
        <option value="">Any Budget</option>
        <option value="0-500">Under $500</option>
        <option value="500-2000">$500–$2,000</option>
        <option value="2000-5000">$2,000–$5,000</option>
        <option value="5000+">$5,000+</option>
      </select>
      <select class="filter-select" id="f-match" onchange="filterJobs()">
        <option value="">All Jobs</option>
        <option value="match">Skill Matches Only</option>
        <option value="saved">Saved Only</option>
        <option value="applied">Applied</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
    </div>

    <div class="jobs-grid" id="jobs-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">🔍</div>
      <h3>No jobs found</h3>
      <p>Try adjusting your filters or search terms.</p>
      <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear Filters</button>
    </div>
  </div>

  <!-- Job Detail Modal -->
  <div class="modal-overlay" id="job-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <style>
    .view-toggle { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; }
    .view-btn { width:32px; height:32px; border:none; background:transparent; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-3); transition:all .15s; }
    .view-btn.active { background:var(--white); color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.1); }
    .jobs-grid.list-view { grid-template-columns:1fr; }
    .job-card.list-card { flex-direction:row; gap:20px; }
    .job-save-btn { border:none; background:transparent; cursor:pointer; color:var(--text-3); font-size:18px; line-height:1; transition:color .15s; flex-shrink:0; padding:2px; }
    .job-save-btn.saved { color:#f59e0b; }
    .job-save-btn:hover  { color:#f59e0b; }
    .new-tag { position:absolute; top:14px; right:14px; background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
  </style>

  <div class="toast" id="toast"><span class="toast-icon">✅</span><span id="toast-msg">Done!</span></div>
  <script src="../freeledger/auth.js"></script>
  <script src="jobs.js"></script>
</body>
</html>
