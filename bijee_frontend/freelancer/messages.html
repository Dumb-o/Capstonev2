<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreeLedger — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { overflow: hidden; }
    .msg-layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 60px); overflow: hidden; }
    .conv-sidebar { background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .conv-header  { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .conv-header h2 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    .conv-search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; transition: border-color .15s; }
    .conv-search-wrap:focus-within { border-color: var(--accent); }
    .conv-search { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); width: 100%; }
    .conv-list { overflow-y: auto; flex: 1; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background .12s; border-bottom: 1px solid var(--border); position: relative; }
    .conv-item:hover  { background: var(--surface); }
    .conv-item.active { background: var(--accent-pale); border-right: 3px solid var(--accent); }
    .conv-item.unread { background: #f0fdf4; }
    .conv-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; position: relative; }
    .online-dot { position: absolute; bottom: 1px; right: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--white); }
    .conv-body  { flex: 1; min-width: 0; }
    .conv-row   { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .conv-name  { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time  { font-size: 11px; color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
    .conv-preview { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .conv-item.unread .conv-preview { color: var(--text-2); font-weight: 600; }
    .unread-badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
    .chat-panel { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
    .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
    .chat-empty-icon { font-size: 56px; margin-bottom: 16px; }
    .chat-empty h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .chat-empty p  { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
    .chat-header { padding: 14px 20px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .chat-header-left  { display: flex; align-items: center; gap: 12px; }
    .chat-header-right { display: flex; align-items: center; gap: 8px; }
    .chat-av   { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .chat-name { font-size: 15px; font-weight: 700; }
    .chat-status { font-size: 12px; color: var(--accent); font-weight: 600; }
    .chat-contract-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-pale); color: var(--accent); border: 1px solid var(--accent-border); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: all .15s; }
    .icon-btn:hover { background: var(--border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
    .date-divider { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-3); margin: 12px 0; display: flex; align-items: center; gap: 10px; }
    .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .msg { display: flex; gap: 8px; max-width: 70%; margin-bottom: 2px; }
    .msg.out { align-self: flex-end; flex-direction: row-reverse; }
    .msg.in  { align-self: flex-start; }
    .msg-av  { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; align-self: flex-end; }
    .msg.out .msg-av { display: none; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; max-width: 100%; word-break: break-word; }
    .msg.in  .msg-bubble { background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.out .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; margin-top: 3px; text-align: right; color: var(--text-3); }
    .msg.out .msg-time { color: rgba(255,255,255,.6); }
    .msg-system { align-self: center; text-align: center; background: #fefce8; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 16px; font-size: 12px; color: #92400e; max-width: 80%; margin: 8px 0; }
    .typing-indicator { align-self: flex-start; display: flex; align-items: center; gap: 8px; }
    .typing-dots { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; display: flex; gap: 4px; align-items: center; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
    .chat-input-area { padding: 14px 20px; background: var(--white); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .chat-input-wrap { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px; transition: border-color .15s; }
    .chat-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(5,150,105,.08); }
    .chat-input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: var(--text); }
    .attach-btn, .emoji-btn { border: none; background: transparent; cursor: pointer; color: var(--text-3); padding: 0; font-size: 16px; transition: color .15s; }
    .attach-btn:hover, .emoji-btn:hover { color: var(--accent); }
    .send-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; flex-shrink: 0; }
    .send-btn:hover  { background: var(--accent-dark); }
    .send-btn:active { transform: scale(.95); }
    .nav-unread { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 0 4px; margin-left: 4px; }
    @media (max-width: 768px) {
      .msg-layout { grid-template-columns: 1fr; }
      .chat-panel { position: absolute; inset: 60px 0 0; z-index: 10; transform: translateX(100%); transition: transform .25s; }
      .chat-panel.open { transform: translateX(0); }
      .back-btn { display: flex !important; }
      .msg { max-width: 85%; }
    }
    .back-btn { display: none; border: none; background: transparent; cursor: pointer; color: var(--text-2); padding: 4px; }
  </style>
</head>
<body>

  <nav class="dash-nav">
    <div class="dash-nav-left">
      <a class="nav-logo" href="../freeledger/index.html">
        <div class="nav-logo-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        FreeLedger
      </a>
      <div class="portal-tag">FREELANCER PORTAL</div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="contracts.html">My Contracts</a>
        <a href="profile.html">My Profile</a>
        <a class="active" href="messages.html">Messages <span class="nav-unread" id="nav-unread" style="display:none"></span></a>
      </div>
    </div>
    <div class="dash-nav-right">
      <button class="btn btn-primary btn-sm" onclick="openNewMsg()">+ New Message</button>
      <button class="btn btn-outline btn-sm" onclick="AUTH.logout()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
      <div class="user-chip">
        <div class="user-info"><div class="uname" id="nav-uname">—</div><div class="urole" id="nav-urole">Freelancer</div></div>
        <div class="user-avatar" id="nav-avatar">?</div>
      </div>
    </div>
  </nav>

  <div class="msg-layout">
    <div class="conv-sidebar">
      <div class="conv-header">
        <h2>Messages</h2>
        <div class="conv-search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="conv-search" placeholder="Search…" oninput="searchConvs(this.value)">
        </div>
      </div>
      <div class="conv-list" id="conv-list"></div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <h3>Select a conversation</h3>
        <p>Choose from the left or start a new message.</p>
        <button class="btn btn-primary btn-sm" onclick="openNewMsg()">+ New Message</button>
      </div>
      <div id="active-chat" style="display:none;height:100%;flex-direction:column">
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="back-btn" onclick="closeChat()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
            <div class="chat-av" id="chat-av">?</div>
            <div>
              <div class="chat-name"   id="chat-name">—</div>
              <div class="chat-status" id="chat-status">—</div>
            </div>
          </div>
          <div class="chat-header-right">
            <div class="chat-contract-badge" id="chat-contract" style="display:none">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span id="chat-contract-name"></span>
            </div>
            <button class="icon-btn" title="More">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <div class="chat-input-wrap">
            <button class="attach-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="text" class="chat-input" id="chat-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
            <button class="emoji-btn" onclick="document.getElementById('chat-input').value+=(['👍','✅','🔥','💡','🎉'][Math.floor(Math.random()*5)])">😊</button>
          </div>
          <button class="send-btn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Message Modal -->
  <div class="modal-overlay" id="new-msg-modal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal-box" style="max-width:440px">
      <button class="modal-close" onclick="document.getElementById('new-msg-modal').classList.remove('open')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">New Message</h2>
      <div class="form-group" style="margin-bottom:14px">
        <label class="form-label">To (Client)</label>
        <select class="form-input" id="nm-to">
          <option value="defilabs">DeFi Labs — E-commerce Project</option>
          <option value="tokenforge">TokenForge — Smart Contract Audit</option>
          <option value="artchain">ArtChain — Brand Guidelines</option>
          <option value="chainmetrics">ChainMetrics — Analytics Dashboard</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Message</label>
        <textarea class="form-input" id="nm-body" rows="4" placeholder="Hi, I wanted to reach out about…" style="resize:vertical"></textarea>
      </div>
      <button class="btn btn-primary btn-full" onclick="startConv()">Send Message →</button>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-icon">✅</span><span id="toast-msg">Done!</span></div>
  <script src="../freeledger/auth.js"></script>
  <script src="messages.js"></script>
</body>
</html>
