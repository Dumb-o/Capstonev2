<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreeLedger — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="messages.css">
</head>
<body>

  <nav class="dash-nav">
    <div class="dash-nav-left">
      <a class="nav-logo" href="dashboard.html">
        <div class="nav-logo-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        FreeLedger
      </a>
      <div class="dash-tag" id="dash-tag">CLIENT PORTAL</div>
      <div class="dash-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="explore-jobs.html">Explore Jobs</a>
        <a href="my-contracts.html">My Contracts</a>
        <a class="active" href="messages.html">Messages <span class="nav-unread" id="nav-unread"></span></a>
      </div>
    </div>
    <div class="dash-nav-right">
      <button class="btn btn-primary btn-sm" onclick="openNewMessage()">+ New Message</button>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
      <div class="user-chip">
        <div class="user-info">
          <div class="uname" id="dash-uname">—</div>
          <div class="urole" id="dash-urole">—</div>
        </div>
        <div class="user-avatar" id="dash-avatar">?</div>
      </div>
    </div>
  </nav>

  <div class="messages-layout">

    <!-- Left: Conversation List -->
    <div class="conv-sidebar" id="conv-sidebar">
      <div class="conv-header">
        <h2>Messages</h2>
        <div class="conv-search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="conv-search" placeholder="Search conversations…" oninput="searchConvs(this.value)">
        </div>
      </div>
      <div class="conv-list" id="conv-list"></div>
    </div>

    <!-- Right: Chat Panel -->
    <div class="chat-panel" id="chat-panel">

      <!-- Empty state (no conversation selected) -->
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <h3>Select a conversation</h3>
        <p>Choose a conversation from the left or start a new one.</p>
        <button class="btn btn-primary btn-sm" onclick="openNewMessage()">+ New Message</button>
      </div>

      <!-- Active chat -->
      <div id="active-chat" style="display:none;height:100%;display:flex;flex-direction:column">

        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="back-btn" onclick="closeChat()" title="Back">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
            <div class="chat-avatar" id="chat-avatar-el">?</div>
            <div>
              <div class="chat-name" id="chat-name-el">—</div>
              <div class="chat-status" id="chat-status-el">—</div>
            </div>
          </div>
          <div class="chat-header-right">
            <div class="chat-contract-badge" id="chat-contract-badge" style="display:none">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span id="chat-contract-name">—</span>
            </div>
            <button class="icon-btn" title="Video call">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </button>
            <button class="icon-btn" title="More options">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chat-messages"></div>

        <!-- Input -->
        <div class="chat-input-area">
          <div class="chat-input-wrap">
            <button class="attach-btn" title="Attach file">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="text" class="chat-input" id="chat-input"
              placeholder="Type a message…" onkeydown="handleKey(event)">
            <button class="emoji-btn" onclick="insertEmoji()">😊</button>
          </div>
          <button class="send-btn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- New Message Modal -->
  <div class="modal-overlay" id="new-msg-modal" onclick="closeNewMsgModal(event)">
    <div class="modal-box" style="max-width:440px">
      <button class="modal-close" onclick="document.getElementById('new-msg-modal').classList.remove('open')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">New Message</h2>
      <div class="form-group" style="margin-bottom:14px">
        <label class="form-label">To (Freelancer)</label>
        <select class="form-input" id="nm-to">
          <option value="alex">Alex Rivera — UI/UX Designer</option>
          <option value="sarah">Sarah Chen — Full Stack Dev</option>
          <option value="jordan">Jordan Smith — Marketing</option>
          <option value="maya">Maya Patel — Graphic Designer</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Message</label>
        <textarea class="form-input" id="nm-body" rows="4" placeholder="Hi, I wanted to reach out about…" style="resize:vertical"></textarea>
      </div>
      <button class="btn btn-primary btn-full" onclick="startNewConversation()">Send Message →</button>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-icon">✅</span><span id="toast-msg">Done!</span></div>
  <script src="messages.js"></script>
</body>
</html>
