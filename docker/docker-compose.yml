version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: freeledger-postgres
    environment:
      POSTGRES_DB: freeledger
      POSTGRES_USER: freeledger
      POSTGRES_PASSWORD: freeledger_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: freeledger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.28.0
    container_name: freeledger-ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
      - ./ipfs/config.sh:/container-init.d/config.sh
    environment:
      IPFS_PROFILE: server

  hardhat:
    image: node:18
    container_name: freeledger-hardhat
    working_dir: /app
    ports:
      - "8545:8545"
    volumes:
      - ../contracts:/app
    command: >
      sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: freeledger-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://freeledger:freeledger_dev@postgres:5432/freeledger
      DATABASE_URL_SYNC: postgresql://freeledger:freeledger_dev@postgres:5432/freeledger
      REDIS_URL: redis://redis:6379/0
      RPC_URL: http://hardhat:8545
      IPFS_API_URL: http://ipfs:5001
      PG_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: change-this-to-a-random-secret-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CHAIN_ID: "31337"
      PLATFORM_FEE_BPS: "250"
      LOG_LEVEL: DEBUG
      # --- BLOCKCHAIN PRIVATE KEYS ---
      # WARNING (MB-006): These keys are intentionally NOT set by default.
      # The Hardhat node assigns deterministic keys to its test accounts.
      # For local development, create a backend/.env file with:
      #   CLIENT_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      #   FREELANCER_PRIVATE_KEY=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      # Without these keys, all on-chain operations will fail with BLOCKCHAIN_NO_KEY errors.
      # Never commit real money private keys — use environment-specific secrets.
      # CLIENT_PRIVATE_KEY=
      # FREELANCER_PRIVATE_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://backend:8000/api
        REACT_APP_IPFS_GATEWAY: http://ipfs:8080
    container_name: freeledger-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  ipfs_data:
